spring.application.name=RoutineBuilder
server.port=${PORT:8080}

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:h2:mem:routinebuilder;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:sa}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# Comma-separated list, e.g. http://localhost:5173,https://your-app.netlify.app
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}
app.seed.enabled=${SEED_DATA:true}

# Leave the token empty to use the offline heuristic instead of Hugging Face
app.ai.huggingface.token=${HUGGINGFACE_API_TOKEN:}
app.ai.huggingface.model-url=${HUGGINGFACE_MODEL_URL:https://router.huggingface.co/hf-inference/models/openai/clip-vit-large-patch14}
